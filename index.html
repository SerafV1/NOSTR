<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/razr.svg" />
    <!-- Added to a phone's home screen, a site with none of this gets a
         screenshot of itself in a white rounded box. These give it the mark. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/razr-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d0d18" />
    <meta name="apple-mobile-web-app-title" content="RAZR" />
    <meta name="description" content="RAZR — a nostr client" />

    <!-- What another client draws when someone shares a link to this one -->
    <meta property="og:title" content="RAZR" />
    <meta property="og:description" content="A nostr client" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://razr.social/" />
    <meta property="og:image" content="https://razr.social/razr-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://razr.social/razr-og.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      What this page shows is other people's: a picture in a note, an avatar,
      a link preview — any of them may be written as a plain http address.
      One of those on an https page makes the whole page mixed, which a
      browser reports as "not secure". This asks the browser to fetch every
      such address over https instead, so nothing on the page can be the
      exception.
    -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <title>RAZR</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
